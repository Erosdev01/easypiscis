<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12141C">
<title>Easy Piscis</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Easy Piscis">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141C;
    --surface:#1A1E2A;
    --surface-raised:#212637;
    --line:#2C3244;
    --line-soft:#232838;
    --text:#ECE9E2;
    --text-dim:#8B90A6;
    --text-faint:#5B6078;
    --accent:#C9A15C;
    --accent-dim:#8f7a4d;
    --accent-soft:#3a3320;
    --teal:#5FA8A0;
    --danger:#C1655A;
    --danger-soft:#3a2521;
    --radius:16px;
    --radius-sm:10px;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 800px 500px at 50% -10%, #1c2033 0%, var(--bg) 60%);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100%;
    overflow-x:hidden;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:0 22px;
    position:relative;
  }
  .screen{
    display:none;
    padding-top:env(safe-area-inset-top, 0px);
    animation:rise .38s cubic-bezier(.22,.9,.32,1);
  }
  .screen.active{display:block;}
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .screen{animation:none;}
  }

  /* ---------- Splash ---------- */
  #splash.screen{display:none;}
  #splash.screen.active{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    text-align:center;
    cursor:pointer;
  }
  .splash-glyph{
    font-size:32px;
    color:var(--teal);
    opacity:.85;
    margin-bottom:16px;
  }
  .splash-title{
    font-family:var(--font-display);
    font-weight:500;
    font-size:38px;
    letter-spacing:-.01em;
    margin:0;
  }
  .splash-title em{
    font-style:italic;
    font-weight:400;
    color:var(--accent);
  }
  .splash-sub{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-top:12px;
  }
  .splash-rule{
    width:56px;
    height:1px;
    background:var(--line);
    margin-top:26px;
    position:relative;
    overflow:hidden;
  }
  .splash-rule::after{
    content:"";
    position:absolute; left:0; top:0; height:100%; width:0;
    background:var(--accent);
    animation:fillLine 1.5s ease forwards;
  }
  @keyframes fillLine{ to{width:100%;} }
  @media (prefers-reduced-motion: reduce){
    .splash-rule::after{animation:none; width:100%;}
  }

  /* ---------- Splash ---------- */
  #splash{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    padding-top:0;
    text-align:center;
    transition:opacity .4s ease;
  }
  #splash.fade-out{opacity:0;}
  .splash-mark{
    font-size:34px;
    color:var(--accent);
    margin-bottom:14px;
  }
  .splash-rule{
    width:34px; height:1px;
    background:var(--line);
    margin:0 0 18px;
  }
  .splash-title{
    font-family:var(--font-display);
    font-weight:500;
    font-size:34px;
    letter-spacing:-.01em;
    margin:0;
  }
  .splash-title em{
    font-style:italic;
    font-weight:400;
    color:var(--accent);
  }
  .splash-tag{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-top:16px;
  }

  /* ---------- Home ---------- */
  #home{padding-top:88px; padding-bottom:40px;}
  .eyebrow{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.18em;
    color:var(--text-faint);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1.title{
    font-family:var(--font-display);
    font-weight:500;
    font-size:44px;
    line-height:1.05;
    margin:0 0 6px;
    letter-spacing:-.01em;
  }
  .title em{
    font-style:italic;
    font-weight:400;
    color:var(--accent);
  }
  .subtitle{
    color:var(--text-dim);
    font-size:14.5px;
    margin:0 0 56px;
    max-width:32ch;
  }
  .home-actions{display:flex; flex-direction:column; gap:14px;}
  .tab-btn{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    text-align:left;
    padding:22px 20px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    font-family:var(--font-body);
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    position:relative;
    overflow:hidden;
  }
  .tab-btn:active{transform:scale(.985);}
  .tab-btn .num{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-faint);
    border:1px solid var(--line);
    border-radius:6px;
    padding:3px 7px;
    flex-shrink:0;
  }
  .tab-btn .label{
    font-family:var(--font-display);
    font-size:21px;
    font-weight:500;
    flex:1;
  }
  .tab-btn .hint{
    font-size:12.5px;
    color:var(--text-faint);
    display:block;
    margin-top:2px;
    font-family:var(--font-body);
  }
  .tab-btn .arrow{color:var(--text-faint); flex-shrink:0; transition:transform .15s ease;}
  .tab-btn:active .arrow{transform:translateX(3px);}
  .tab-btn.primary{
    background:linear-gradient(155deg, #22283a, var(--surface));
    border-color:var(--accent-dim);
  }
  .tab-btn.primary .num{color:var(--accent); border-color:var(--accent-dim);}
  .tab-btn.primary::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--accent);
  }
  .tab-btn.secondary::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--teal);
  }

  /* ---------- Top bar (add/view screens) ---------- */
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:24px 0 22px;
    position:sticky; top:0;
    background:linear-gradient(var(--bg) 78%, transparent);
    z-index:5;
  }
  .back-btn{
    width:38px; height:38px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .back-btn:active{background:var(--surface-raised);}
  .topbar h2{
    font-family:var(--font-display);
    font-weight:500;
    font-size:24px;
    margin:0;
  }

  /* ---------- Form ---------- */
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-family:var(--font-mono);
    margin-bottom:8px;
  }
  .field input[type=text],
  .field input[type=time],
  .field input[type=number],
  .field textarea,
  .field select{
    width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:var(--font-body);
    font-size:16px;
    padding:14px 14px;
    outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus,
  .field textarea:focus,
  .field select:focus{border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:70px; font-family:var(--font-body);}
  .row-split{display:flex; gap:10px;}
  .row-split .field{flex:1; margin-bottom:0;}
  .row-split{margin-bottom:18px;}
  .amount-wrap{position:relative;}
  .amount-wrap span{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color:var(--accent); font-family:var(--font-mono); font-size:16px;
  }
  .amount-wrap input{padding-left:28px !important; font-family:var(--font-mono);}
  select{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238B90A6' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 14px center;}

  /* ---------- Wheel picker (tipo selector de alarma) ---------- */
  .wheel-group{display:flex; align-items:center; gap:8px;}
  .wheel-group .wheel-frame{flex:1;}
  .wheel-sep{
    font-family:var(--font-mono);
    color:var(--text-faint);
    font-size:16px;
    padding:0 1px;
    flex-shrink:0;
  }
  .wheel-frame{
    position:relative;
    height:54px;
    border-radius:var(--radius-sm);
    background:var(--surface);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .wheel-frame::before,
  .wheel-frame::after{
    content:"";
    position:absolute; left:0; right:0; height:9px;
    pointer-events:none; z-index:2;
  }
  .wheel-frame::before{top:0; background:linear-gradient(180deg, var(--surface) 20%, transparent 100%);}
  .wheel-frame::after{bottom:0; background:linear-gradient(0deg, var(--surface) 20%, transparent 100%);}
  .wheel-scroll{
    height:100%;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    touch-action:pan-y;
  }
  .wheel-scroll::-webkit-scrollbar{display:none;}
  .wheel-item{
    height:36px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono);
    font-size:16px;
    color:var(--text-dim);
    scroll-snap-align:center;
    user-select:none;
    cursor:pointer;
  }
  .wheel-highlight{
    position:absolute; left:0; right:0; top:50%; height:36px;
    transform:translateY(-50%);
    border-top:1px solid var(--accent-dim);
    border-bottom:1px solid var(--accent-dim);
    background:linear-gradient(180deg, rgba(201,161,92,.07), rgba(201,161,92,.02));
    pointer-events:none;
    z-index:1;
  }

  .save-btn{
    width:100%;
    padding:16px;
    border-radius:var(--radius-sm);
    border:none;
    background:var(--accent);
    color:#20180a;
    font-family:var(--font-body);
    font-weight:600;
    font-size:15.5px;
    cursor:pointer;
    margin-top:8px;
    transition:transform .12s ease, opacity .12s ease;
  }
  .save-btn:active{transform:scale(.98);}
  .delete-btn{
    width:100%;
    padding:14px;
    border-radius:var(--radius-sm);
    border:1px solid var(--danger-soft);
    background:transparent;
    color:var(--danger);
    font-family:var(--font-body);
    font-size:14.5px;
    cursor:pointer;
    margin-top:10px;
  }
  .delete-btn:active{background:var(--danger-soft);}

  /* ---------- Ledger list ---------- */
  #view{padding-bottom:60px;}
  .ledger{list-style:none; margin:6px 0 0; padding:0;}
  .ledger-row{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:16px 4px 16px 12px;
    border-bottom:1px solid var(--line-soft);
    border-left:3px solid transparent;
    cursor:pointer;
  }
  .ledger-row:active{background:var(--surface);}
  .ledger-row .idx{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--text-faint);
    padding-top:3px;
    min-width:22px;
  }
  .ledger-row .main{flex:1; min-width:0;}
  .ledger-row .servicio{
    font-family:var(--font-display);
    font-size:17px;
    font-weight:500;
    margin-bottom:3px;
  }
  .ledger-row .meta{
    font-size:12.5px;
    color:var(--text-dim);
    font-family:var(--font-mono);
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .ledger-row .meta .fecha{color:var(--text-faint);}
  .ledger-row .otro{
    font-size:12.5px;
    color:var(--text-faint);
    margin-top:4px;
    font-style:italic;
  }
  .ledger-row .monto{
    font-family:var(--font-mono);
    font-weight:600;
    color:var(--accent);
    font-size:16px;
    white-space:nowrap;
    padding-top:2px;
  }
  .empty-state{
    text-align:center;
    padding:80px 10px 40px;
    color:var(--text-faint);
  }
  .empty-state .glyph{font-size:32px; margin-bottom:14px; opacity:.5;}
  .empty-state p{font-size:14px; max-width:26ch; margin:0 auto;}
  .day-header{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:22px 0 4px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .day-header:first-child{margin-top:0;}
  .total-bar{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:16px 4px 10px;
    margin-bottom:4px;
  }
  .total-bar .lbl{font-size:12px; color:var(--text-faint); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.08em;}
  .total-bar .val{font-family:var(--font-mono); font-size:19px; color:var(--accent); font-weight:600;}
  .period-tabs{
    display:flex;
    gap:6px;
  }
  .period-tab{
    flex:1;
    text-align:center;
    padding:9px 0;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text-dim);
    font-family:var(--font-mono);
    font-size:12px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .period-tab.active{
    border-color:var(--accent-dim);
    background:var(--accent-soft);
    color:var(--accent);
  }
  .total-count{
    font-size:11px;
    color:var(--text-faint);
    font-family:var(--font-mono);
    margin-top:2px;
  }
  .service-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .service-tab{
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text-dim);
    font-family:var(--font-mono);
    font-size:11.5px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .service-tab.active{
    border-color:var(--teal);
    background:rgba(95,168,160,.14);
    color:var(--teal);
  }
  .color-row{
    display:flex;
    gap:16px;
    padding:4px 2px 2px;
  }
  .color-swatch{
    width:32px;
    height:32px;
    border-radius:50%;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 0 0 2px var(--bg), 0 0 0 2px var(--bg);
  }
  .color-swatch.selected{
    transform:scale(1.12);
    box-shadow:0 0 0 3px var(--bg), 0 0 0 5px rgba(236,233,222,.55);
  }
  .color-filter-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .color-dot-btn{
    width:24px;
    height:24px;
    border-radius:50%;
    cursor:pointer;
    box-shadow:0 0 0 2px var(--bg), 0 0 0 2px var(--bg);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .color-dot-btn.active{
    transform:scale(1.15);
    box-shadow:0 0 0 2px var(--bg), 0 0 0 4px rgba(236,233,222,.5);
  }
  .filters-row{
    display:flex;
    gap:7px;
    margin-bottom:8px;
  }
  .filter-chip{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
    padding:8px 9px;
    border-radius:var(--radius-sm);
    border:1px solid var(--line);
    background:var(--surface);
    cursor:pointer;
  }
  .filter-chip.is-open{border-color:var(--accent-dim);}
  .filter-chip-label{
    font-family:var(--font-mono);
    font-size:9px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .filter-chip-value{
    display:flex;
    align-items:center;
    gap:4px;
    width:100%;
  }
  .filter-chip-value .val-text{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-family:var(--font-body);
    font-size:12px;
    color:var(--text-main);
  }
  .filter-chip .chev{
    font-size:9px;
    color:var(--text-faint);
    flex-shrink:0;
    transition:transform .2s ease;
  }
  .filter-chip .chev.open{transform:rotate(180deg);}
  .filter-panel{
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    background:var(--surface);
    padding:12px 14px;
    margin-bottom:10px;
  }
  .color-current-dot{
    width:9px; height:9px;
    border-radius:50%;
    display:inline-block;
    flex-shrink:0;
  }
  .date-filter-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .date-input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:14px;
    padding:10px 12px;
    color-scheme:dark;
  }
  .date-input:focus{outline:none; border-color:var(--accent);}
  .clear-date-btn{
    flex-shrink:0;
    padding:10px 14px;
    border-radius:var(--radius-sm);
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text-dim);
    font-family:var(--font-mono);
    font-size:12px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="app">

  <!-- SPLASH -->
  <section id="splash" class="screen active">
    <div class="splash-mark">♓</div>
    <div class="splash-rule"></div>
    <h1 class="splash-title">Easy <em>Piscis</em></h1>
    <div class="splash-tag">Registro personal</div>
  </section>

  <!-- HOME -->
  <section id="home" class="screen">
    <div class="eyebrow">Registro personal</div>
    <h1 class="title">Tu <em>agenda</em></h1>
    <p class="subtitle">Cargá cada servicio o consultá lo que ya anotaste.</p>
    <div class="home-actions">
      <button class="tab-btn primary" onclick="openAddNew()">
        <span class="num">＋</span>
        <span style="flex:1">
          <span class="label">Agregar</span>
          <span class="hint">Cargar un nuevo registro</span>
        </span>
        <span class="arrow">→</span>
      </button>
      <button class="tab-btn secondary" onclick="showScreen('view')">
        <span class="num">≡</span>
        <span style="flex:1">
          <span class="label">Ver</span>
          <span class="hint">Repasar, editar o borrar</span>
        </span>
        <span class="arrow">→</span>
      </button>
    </div>
  </section>

  <!-- ADD / EDIT -->
  <section id="add" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="goHomeFromAdd()">←</button>
      <h2 id="addTitle">Agregar</h2>
    </div>
    <form id="entryForm" onsubmit="return saveEntry(event)">
      <div class="field">
        <label>Servicio</label>
        <div class="wheel-frame">
          <div class="wheel-scroll" id="wheelServicio"></div>
          <div class="wheel-highlight"></div>
        </div>
      </div>

      <div class="field">
        <label>Color</label>
        <div class="color-row" id="colorPicker"></div>
      </div>

      <div class="field">
        <label>Duración</label>
        <div class="wheel-group">
          <div class="wheel-frame">
            <div class="wheel-scroll" id="wheelDurHoras"></div>
            <div class="wheel-highlight"></div>
          </div>
          <span class="wheel-sep">h</span>
          <div class="wheel-frame">
            <div class="wheel-scroll" id="wheelDurMin"></div>
            <div class="wheel-highlight"></div>
          </div>
          <span class="wheel-sep">min</span>
        </div>
      </div>

      <div class="field">
        <label>Hora</label>
        <div class="wheel-group">
          <div class="wheel-frame">
            <div class="wheel-scroll" id="wheelHoraH"></div>
            <div class="wheel-highlight"></div>
          </div>
          <span class="wheel-sep">:</span>
          <div class="wheel-frame">
            <div class="wheel-scroll" id="wheelHoraM"></div>
            <div class="wheel-highlight"></div>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="monto">Monto</label>
        <div class="amount-wrap">
          <span>$</span>
          <input type="number" id="monto" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
        </div>
      </div>

      <div class="field">
        <label for="otro">Otro</label>
        <textarea id="otro" placeholder="Notas adicionales, opcional"></textarea>
      </div>

      <button type="submit" class="save-btn" id="saveBtnLabel">Guardar registro</button>
      <button type="button" class="delete-btn" id="deleteBtn" style="display:none" onclick="deleteCurrentEntry()">Eliminar registro</button>
    </form>
  </section>

  <!-- VIEW -->
  <section id="view" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <h2>Ver registros</h2>
    </div>
    <div id="viewContent"></div>
  </section>

</div>

<script>
  const STORAGE_KEY = 'agenda_entries_v2';
  let editingId = null;
  const ITEM_H = 36;
  const WHEEL_PAD = 9; // (altura del marco 54px - ITEM_H)/2, para centrar el valor seleccionado

  function createWheel(elId, values, format){
    const el = document.getElementById(elId);
    el.innerHTML = '';
    const padTop = document.createElement('div');
    padTop.style.height = WHEEL_PAD+'px';
    el.appendChild(padTop);

    values.forEach((v, i) => {
      const item = document.createElement('div');
      item.className = 'wheel-item';
      item.textContent = format ? format(v) : v;
      item.addEventListener('click', () => el.scrollTo({top: i*ITEM_H, behavior:'smooth'}));
      el.appendChild(item);
    });

    const padBottom = document.createElement('div');
    padBottom.style.height = WHEEL_PAD+'px';
    el.appendChild(padBottom);

    function updateStyles(){
      const items = el.querySelectorAll('.wheel-item');
      const center = el.scrollTop + el.clientHeight/2;
      items.forEach(item => {
        const itemCenter = item.offsetTop + ITEM_H/2;
        const dist = Math.abs(center - itemCenter) / ITEM_H;
        item.style.opacity = Math.max(0.28, 1 - dist*0.4);
        item.style.transform = `scale(${Math.max(0.82, 1 - dist*0.12)})`;
      });
    }
    el.addEventListener('scroll', () => requestAnimationFrame(updateStyles));
    updateStyles();

    return {
      get(){
        const idx = Math.min(values.length-1, Math.max(0, Math.round(el.scrollTop / ITEM_H)));
        return values[idx];
      },
      set(value){
        const idx = values.indexOf(value);
        if(idx < 0) return;
        el.scrollTop = idx * ITEM_H;
        updateStyles();
      }
    };
  }

  const pad2 = n => String(n).padStart(2,'0');
  let wheelServicio, wheelDurHoras, wheelDurMin, wheelHoraH, wheelHoraM;

  const COLORS = [
    {id:'ambar', hex:'#C9A15C', label:'Ámbar'},
    {id:'verde', hex:'#5FA8A0', label:'Verde'},
    {id:'rojo', hex:'#C1655A', label:'Rojo'},
    {id:'azul', hex:'#6C8FC7', label:'Azul'},
    {id:'violeta', hex:'#9C7FC9', label:'Violeta'}
  ];
  let selectedColor = COLORS[0].id;

  function buildColorPicker(){
    const el = document.getElementById('colorPicker');
    el.innerHTML = '';
    COLORS.forEach(c => {
      const dot = document.createElement('div');
      dot.className = 'color-swatch';
      dot.style.background = c.hex;
      dot.title = c.label;
      dot.dataset.id = c.id;
      dot.addEventListener('click', () => selectColor(c.id));
      el.appendChild(dot);
    });
    updateColorPickerUI();
  }
  function selectColor(id){
    selectedColor = id;
    updateColorPickerUI();
  }
  function updateColorPickerUI(){
    document.querySelectorAll('#colorPicker .color-swatch').forEach(d => {
      d.classList.toggle('selected', d.dataset.id === selectedColor);
    });
  }
  function colorOf(id){
    return COLORS.find(c => c.id === id) || COLORS[0];
  }

  function initWheels(){
    wheelServicio = createWheel('wheelServicio', SERVICIOS);
    wheelDurHoras = createWheel('wheelDurHoras', Array.from({length:10}, (_,i)=>i), v => String(v));
    wheelDurMin = createWheel('wheelDurMin', [0,5,10,15,20,25,30,35,40,45,50,55], pad2);
    wheelHoraH = createWheel('wheelHoraH', Array.from({length:24}, (_,i)=>i), pad2);
    wheelHoraM = createWheel('wheelHoraM', Array.from({length:60}, (_,i)=>i), pad2);
    buildColorPicker();
    resetForm();
  }
  window.addEventListener('DOMContentLoaded', () => {
    initWheels();
    setTimeout(() => {
      const splash = document.getElementById('splash');
      splash.classList.add('fade-out');
      setTimeout(() => showScreen('home'), 400);
    }, 1500);
  });

  function loadEntries(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveEntries(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'view') renderView();
  }

  function goHomeFromAdd(){
    resetForm();
    showScreen('home');
  }

  function resetForm(){
    editingId = null;
    document.getElementById('monto').value = '';
    document.getElementById('otro').value = '';
    if(wheelServicio){
      wheelServicio.set('Encuentro');
      wheelDurHoras.set(0);
      wheelDurMin.set(0);
      const now = new Date();
      wheelHoraH.set(now.getHours());
      wheelHoraM.set(now.getMinutes());
    }
    selectedColor = COLORS[0].id;
    updateColorPickerUI();
    document.getElementById('addTitle').textContent = 'Agregar';
    document.getElementById('saveBtnLabel').textContent = 'Guardar registro';
    document.getElementById('deleteBtn').style.display = 'none';
  }

  function openAddNew(){
    resetForm();
    showScreen('add');
  }

  function saveEntry(e){
    e.preventDefault();
    const entry = {
      id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2,6)),
      servicio: wheelServicio.get(),
      duracionHoras: wheelDurHoras.get(),
      duracionMinutos: wheelDurMin.get(),
      horaH: wheelHoraH.get(),
      horaM: wheelHoraM.get(),
      color: selectedColor,
      monto: document.getElementById('monto').value,
      otro: document.getElementById('otro').value.trim(),
      fechaISO: editingId ? (loadEntries().find(x=>x.id===editingId)?.fechaISO || new Date().toISOString()) : new Date().toISOString()
    };
    let list = loadEntries();
    if(editingId){
      list = list.map(x => x.id === editingId ? entry : x);
    }else{
      list.push(entry);
    }
    saveEntries(list);
    resetForm();
    showScreen('view');
    return false;
  }

  function deleteCurrentEntry(){
    if(!editingId) return;
    if(!confirm('¿Eliminar este registro?')) return;
    let list = loadEntries().filter(x => x.id !== editingId);
    saveEntries(list);
    resetForm();
    showScreen('view');
  }

  function editEntry(id){
    const entry = loadEntries().find(x => x.id === id);
    if(!entry) return;
    editingId = id;
    wheelServicio.set(entry.servicio || 'Encuentro');
    wheelDurHoras.set(entry.duracionHoras ?? 0);
    wheelDurMin.set(entry.duracionMinutos ?? 0);
    wheelHoraH.set(entry.horaH ?? 0);
    wheelHoraM.set(entry.horaM ?? 0);
    selectedColor = entry.color || COLORS[0].id;
    updateColorPickerUI();
    document.getElementById('monto').value = entry.monto || '';
    document.getElementById('otro').value = entry.otro || '';
    document.getElementById('addTitle').textContent = 'Editar';
    document.getElementById('saveBtnLabel').textContent = 'Guardar cambios';
    document.getElementById('deleteBtn').style.display = 'block';
    showScreen('add');
  }

  function fmtMoney(v){
    const n = parseFloat(v || 0);
    return n.toLocaleString('es-AR', {minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits:2});
  }
  function fmtDay(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
  }
  function fmtDuracion(h, m){
    const parts = [];
    if(h) parts.push(`${h}h`);
    if(m) parts.push(`${m}min`);
    return parts.join(' ') || '—';
  }

  let totalPeriod = 'dia';
  let servicioFilter = 'todos';
  let colorFilter = 'todos';
  let fechaFiltro = null; // 'YYYY-MM-DD' o null
  let filterOpen = {periodo:false, servicio:false, color:false, fecha:false};
  const PERIOD_LABELS = {dia:'Hoy', semana:'Esta semana', mes:'Este mes', anio:'Este año'};
  const SERVICIOS = ['Encuentro','Videollamada','Cafecito','Telegram'];

  function toggleFilter(key){
    const wasOpen = filterOpen[key];
    filterOpen = {periodo:false, servicio:false, color:false, fecha:false};
    filterOpen[key] = !wasOpen;
    renderView();
  }

  function setPeriod(p){
    totalPeriod = p;
    filterOpen.periodo = false;
    renderView();
  }

  function setServicioFilter(s){
    servicioFilter = s;
    filterOpen.servicio = false;
    renderView();
  }

  function setColorFilter(c){
    colorFilter = c;
    filterOpen.color = false;
    renderView();
  }

  function setFechaFiltro(value){
    fechaFiltro = value || null;
    filterOpen.fecha = false;
    renderView();
  }

  function filterByServicio(list, servicio){
    if(servicio === 'todos') return list;
    return list.filter(e => e.servicio === servicio);
  }

  function filterByColor(list, color){
    if(color === 'todos') return list;
    return list.filter(e => e.color === color);
  }

  function filterByFecha(list, fechaStr){
    if(!fechaStr) return list;
    return list.filter(e => {
      const d = new Date(e.fechaISO);
      const local = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      return local === fechaStr;
    });
  }

  function fmtFechaCorta(fechaStr){
    const [y,m,d] = fechaStr.split('-');
    return `${d}/${m}/${y.slice(2)}`;
  }

  function isSameDay(d1, d2){
    return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate();
  }

  function getWeekRange(ref){
    const day = ref.getDay(); // 0=domingo..6=sábado
    const diffToMonday = (day === 0 ? -6 : 1 - day);
    const monday = new Date(ref);
    monday.setDate(ref.getDate() + diffToMonday);
    monday.setHours(0,0,0,0);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23,59,59,999);
    return [monday, sunday];
  }

  function filterByPeriod(list, period){
    const now = new Date();
    if(period === 'dia'){
      return list.filter(e => isSameDay(new Date(e.fechaISO), now));
    }
    if(period === 'semana'){
      const [start, end] = getWeekRange(now);
      return list.filter(e => { const d = new Date(e.fechaISO); return d >= start && d <= end; });
    }
    if(period === 'mes'){
      return list.filter(e => { const d = new Date(e.fechaISO); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); });
    }
    if(period === 'anio'){
      return list.filter(e => new Date(e.fechaISO).getFullYear() === now.getFullYear());
    }
    return list;
  }

  function renderView(){
    const list = loadEntries().slice().sort((a,b)=> new Date(b.fechaISO) - new Date(a.fechaISO));
    const content = document.getElementById('viewContent');

    if(list.length === 0){
      content.innerHTML = `
        <div class="empty-state">
          <div class="glyph">◇</div>
          <p>Todavía no cargaste ningún registro. Tocá "Agregar" desde el inicio para empezar tu libro.</p>
        </div>`;
      return;
    }

    const serviceFiltered = filterByServicio(list, servicioFilter);
    const colorFiltered = filterByColor(serviceFiltered, colorFilter);
    const fechaFiltered = filterByFecha(colorFiltered, fechaFiltro);
    const periodServiceColor = filterByPeriod(fechaFiltered, totalPeriod);
    const total = periodServiceColor.reduce((sum, x) => sum + (parseFloat(x.monto) || 0), 0);

    const servicioLabel = servicioFilter === 'todos' ? '' : ` · ${servicioFilter}`;
    const colorLabel = colorFilter === 'todos' ? '' : ` · ${colorOf(colorFilter).label}`;
    const fechaLabel = fechaFiltro ? ` · ${fmtFechaCorta(fechaFiltro)}` : '';

    let html = `
      <div class="total-bar">
        <div>
          <span class="lbl">Total · ${PERIOD_LABELS[totalPeriod]}${servicioLabel}${colorLabel}${fechaLabel}</span>
          <div class="total-count">${periodServiceColor.length} registro${periodServiceColor.length===1?'':'s'}</div>
        </div>
        <span class="val">$ ${fmtMoney(total)}</span>
      </div>
      <div class="filters-row">
        <button class="filter-chip ${filterOpen.periodo?'is-open':''}" onclick="toggleFilter('periodo')">
          <span class="filter-chip-label">Período</span>
          <span class="filter-chip-value">
            <span class="val-text">${PERIOD_LABELS[totalPeriod]}</span>
            <span class="chev ${filterOpen.periodo?'open':''}">⌄</span>
          </span>
        </button>
        <button class="filter-chip ${filterOpen.servicio?'is-open':''}" onclick="toggleFilter('servicio')">
          <span class="filter-chip-label">Servicio</span>
          <span class="filter-chip-value">
            <span class="val-text">${servicioFilter==='todos' ? 'Todos' : servicioFilter}</span>
            <span class="chev ${filterOpen.servicio?'open':''}">⌄</span>
          </span>
        </button>
        <button class="filter-chip ${filterOpen.color?'is-open':''}" onclick="toggleFilter('color')">
          <span class="filter-chip-label">Color</span>
          <span class="filter-chip-value">
            ${colorFilter!=='todos' ? `<span class="color-current-dot" style="background:${colorOf(colorFilter).hex}"></span>` : ''}
            <span class="val-text">${colorFilter==='todos' ? 'Todos' : colorOf(colorFilter).label}</span>
            <span class="chev ${filterOpen.color?'open':''}">⌄</span>
          </span>
        </button>
        <button class="filter-chip ${filterOpen.fecha?'is-open':''}" onclick="toggleFilter('fecha')">
          <span class="filter-chip-label">Fecha</span>
          <span class="filter-chip-value">
            <span class="val-text">${fechaFiltro ? fmtFechaCorta(fechaFiltro) : 'Cualquiera'}</span>
            <span class="chev ${filterOpen.fecha?'open':''}">⌄</span>
          </span>
        </button>
      </div>
      ${filterOpen.periodo ? `
      <div class="filter-panel">
        <div class="period-tabs">
          <button class="period-tab ${totalPeriod==='dia'?'active':''}" onclick="setPeriod('dia')">Día</button>
          <button class="period-tab ${totalPeriod==='semana'?'active':''}" onclick="setPeriod('semana')">Semana</button>
          <button class="period-tab ${totalPeriod==='mes'?'active':''}" onclick="setPeriod('mes')">Mes</button>
          <button class="period-tab ${totalPeriod==='anio'?'active':''}" onclick="setPeriod('anio')">Año</button>
        </div>
      </div>` : ''}
      ${filterOpen.servicio ? `
      <div class="filter-panel">
        <div class="service-tabs">
          <button class="service-tab ${servicioFilter==='todos'?'active':''}" onclick="setServicioFilter('todos')">Todos</button>
          ${SERVICIOS.map(s => `<button class="service-tab ${servicioFilter===s?'active':''}" onclick="setServicioFilter('${s}')">${s}</button>`).join('')}
        </div>
      </div>` : ''}
      ${filterOpen.color ? `
      <div class="filter-panel">
        <div class="color-filter-row">
          <button class="service-tab ${colorFilter==='todos'?'active':''}" onclick="setColorFilter('todos')">Todos</button>
          ${COLORS.map(c => `<div class="color-dot-btn ${colorFilter===c.id?'active':''}" style="background:${c.hex}" title="${c.label}" onclick="setColorFilter('${c.id}')"></div>`).join('')}
        </div>
      </div>` : ''}
      ${filterOpen.fecha ? `
      <div class="filter-panel">
        <div class="date-filter-row">
          <input type="date" class="date-input" value="${fechaFiltro || ''}" onchange="setFechaFiltro(this.value)">
          ${fechaFiltro ? `<button type="button" class="clear-date-btn" onclick="setFechaFiltro('')">Quitar</button>` : ''}
        </div>
      </div>` : ''}`;

    if(fechaFiltered.length === 0){
      html += `
        <div class="empty-state" style="padding-top:44px;">
          <div class="glyph">◇</div>
          <p>No hay registros que coincidan con este filtro todavía.</p>
        </div>`;
      content.innerHTML = html;
      return;
    }

    let lastDay = null;
    fechaFiltered.forEach((entry, i) => {
      const dayKey = new Date(entry.fechaISO).toDateString();
      if(dayKey !== lastDay){
        html += `<div class="day-header">${fmtDay(entry.fechaISO)}</div>`;
        lastDay = dayKey;
      }
      const dur = fmtDuracion(entry.duracionHoras, entry.duracionMinutos);
      const hora = (entry.horaH !== undefined && entry.horaH !== null) ? `${pad2(entry.horaH)}:${pad2(entry.horaM)}` : '';
      const rowColor = colorOf(entry.color).hex;
      html += `
        <div class="ledger-row" style="border-left-color:${rowColor}" onclick="editEntry('${entry.id}')">
          <span class="idx">${String(i+1).padStart(2,'0')}</span>
          <span class="main">
            <div class="servicio">${escapeHtml(entry.servicio || 'Sin nombre')}</div>
            <div class="meta">
              ${hora ? `<span>${hora}</span>` : ''}
              ${dur !== '—' ? `<span>${dur}</span>` : ''}
            </div>
            ${entry.otro ? `<div class="otro">${escapeHtml(entry.otro)}</div>` : ''}
          </span>
          <span class="monto">$ ${fmtMoney(entry.monto)}</span>
        </div>`;
    });

    content.innerHTML = html + `<div style="height:20px"></div>`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- PWA: registro del service worker ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('No se pudo registrar el service worker:', err);
      });
    });
  }
</script>
</body>
</html>
